plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.kazuyoo.bassboost'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.kazuyoo.bassboost'
        minSdk 33
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {}
