name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'
      - name: Build Release APK
        run: gradle assembleRelease --no-daemon

      # Sign the APK so it installs as a normal app (no root needed).
      # Optional secrets KEYSTORE_B64 + KEYSTORE_PASSWORD give every build the same key,
      # so updates install over the previous version. Without them a temporary key is
      # generated and an update needs "adb uninstall" first.
      - name: Sign APK
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          set -e
          KS="$RUNNER_TEMP/release.p12"
          ALIAS=bassboost
          PASS="${KS_PASS:-bassboost-ci}"
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
          else
            echo "No KEYSTORE_B64 secret: generating a temporary key"
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 \
              -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Kazuyoo BassBoost"
          fi
          BT="$(ls -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"/build-tools/* | sort -V | tail -1)"
          echo "Using build-tools: $BT"
          "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-pass "pass:$PASS" \
            --ks-key-alias "$ALIAS" --key-pass "pass:$PASS" \
            --out BassBoost-signed.apk "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify BassBoost-signed.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BassBoost-release
          path: BassBoost-signed.apk
          retention-days: 30
